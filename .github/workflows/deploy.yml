name: Deploy to Hugging Face Space

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Deploy to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "github-actions"

          git clone https://huggingface.co/spaces/RijjaExplore/infravision-ai-api hf-space

          # Copy files BEFORE entering folder
          rsync -av --exclude='.git' ./ hf-space/

          cd hf-space

          git remote set-url origin https://RijjaExplore:$HF_TOKEN@huggingface.co/spaces/RijjaExplore/infravision-ai-api

          git add .
          git commit -m "Auto deploy" || echo "No changes"
          git push origin main
