name: Deploy to Hugging Face Space

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git clone https://RijjaExplore:$HF_TOKEN@huggingface.co/spaces/RijjaExplore/infravision-ai-api space-repo
          rsync -av --exclude='.git' ./ space-repo/
          cd space-repo
          git add .
          git commit -m "Auto deploy" || echo "No changes"
          git push
