name: Deploy to Render

on:
  push:
    branches:
      - main
      - develop

env:
  REGISTRY: docker.io

jobs:
  test-backend:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run basic checks
        run: |
          python -m py_compile finalwebapp_api.py
          echo "✅ Backend Python syntax valid"

  test-frontend:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      
      - name: Build frontend
        run: |
          cd frontend
          npm run build
          echo "✅ Frontend build successful"

  render-deploy:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      # Render auto-deploys on git push to connected repo
      # This is a status check that your deployment pipeline worked
      - name: Notify Render Deployment
        run: |
          echo "✅ Deployment triggered on Render"
          echo "Monitor progress at: https://dashboard.render.com"
          echo "Backend: https://infravision-ai-backend.onrender.com"
          echo "Frontend: https://infravision-ai-frontend.onrender.com"
      
      - name: Verify Deployment Readiness
        run: |
          [ -f "Procfile" ] && echo "✅ Procfile exists" || exit 1
          grep -q "gunicorn" requirements.txt && echo "✅ gunicorn configured" || exit 1
          [ -d "frontend" ] && echo "✅ Frontend directory exists" || exit 1
          echo "🚀 Deployment ready!"
