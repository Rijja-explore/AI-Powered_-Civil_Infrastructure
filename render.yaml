services:
  # Backend API Service
  - type: web
    name: infravision-ai-backend
    env: python
    plan: starter
    buildCommand: pip install --prefer-binary -r requirements.txt
    startCommand: gunicorn -w 4 -b 0.0.0.0:$PORT finalwebapp_api:app
    
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "False"
      - key: SECRET_KEY
        value: your-secret-key-here
      - key: CORS_ORIGINS
        value: https://infravision-ai-frontend.onrender.com
      - key: MAX_CONTENT_LENGTH
        value: "52428800"
      - key: MAX_FRAMES_TO_PROCESS
        value: "8"
      - key: USE_GPU
        value: "False"
    
    autoDeploy: true
    region: us-east

  # PostgreSQL Database (Optional)
  # Uncomment to use database
  # - type: pserv
  #   name: infravision-db
  #   plan: starter
  #   region: us-east
  #   databaseName: infravision_db
  #   user: admin
  #   postgres_version: 15
